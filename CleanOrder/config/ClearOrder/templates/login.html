{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanOrder - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center relative overflow-hidden font-sans text-slate-700 antialiased">
    

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md px-4 relative z-10">
        

        <div class="bg-white/90 backdrop-blur-xl p-8 sm:p-10 rounded-[2rem] border border-slate-100 shadow-2xl shadow-slate-200/50">
            
            <div class="flex flex-col items-center mb-8">
    
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl shadow-md shadow-blue-600/20 mb-4 w-14 h-14 flex items-center justify-center">
          <i class="fa-solid fa-broom text-2xl"></i>
        </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">CleanOrder</h1>
           <p class="text-slate-400 text-sm font-medium mt-1 text-center">Gestão Inteligente de Alojamentos</p>
       </div>

            <!--Mensagens de Erro-->
            {% if messages %}
                <div class="mb-6 p-4 bg-rose-50 border border-rose-100 rounded-xl">
                    {% for message in messages %}
                        <p class="text-rose-600 text-sm text-center font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                
                <!-- CPF -->
                <div class="space-y-1.5">
                    <label class="block text-slate-500 text-xs font-bold uppercase tracking-wider pl-1">CPF</label>
                    <input type="text" name="cpf" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all" maxlength="11" placeholder="000.000.000-00" required>
                </div>
                
                <!-- Senha -->
                <div class="space-y-1.5">
                    <label class="block text-slate-500 text-xs font-bold uppercase tracking-wider pl-1">Senha</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all pr-12" placeholder="••••••••" required>
                        
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-1 flex items-center justify-center w-10 text-slate-400 hover:text-blue-600 focus:outline-none transition-colors">
                            <img id="eyeIcon" src="{% static 'img/view-eye-svgrepo-com.svg' %}" alt="Mostrar senha" class="w-5 h-5 opacity-60 hover:opacity-100 transition-opacity"> 
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-bold py-4 px-4 rounded-xl hover:shadow-lg hover:shadow-blue-600/30 transform hover:-translate-y-0.5 transition-all duration-200 flex justify-center items-center gap-2 mt-4">
                    <span>Acessar o Sistema</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>

        <footer class="text-center text-slate-400 text-xs font-medium mt-8 tracking-wide">
            © 2026 CleanOrder.
        </footer>
        
    </main>

    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#id_password');
    
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function (e) {
                    e.preventDefault(); 
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                    } else {
                        passwordInput.type = 'password';
                    }
                });
            }
        });
    </script>
</body>
</html>
